name: Deploy site to GitHub Pages

# Deploys the marketing site to GitHub Pages.
# NOTE: GitHub Pages requires the repo to be PUBLIC on the free plan (or a paid plan for
# private). Once that's the case, enable Pages (Settings > Pages > Source: GitHub Actions)
# and this runs. It's manual (workflow_dispatch) for now so it doesn't fail on every push.
# Live at: https://maazsiddiqui01.github.io/flowtype-ai/
# For the production domain (flowtype.dev): set VITE_BASE=/ below + add a CNAME + point DNS.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /flowtype-ai/
        run: |
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for client-side routes
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
