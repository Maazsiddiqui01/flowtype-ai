name: Deploy site to GitHub Pages

# Deploys the marketing site to GitHub Pages on every push to main.
# Live (staging): https://maazsiddiqui01.github.io/flowtype-ai/
# For a custom domain: add public/CNAME with the domain, set VITE_BASE=/ below, and point DNS.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /flowtype-ai/
        run: |
          npm run build
          cp dist/index.html dist/404.html   # SPA fallback for client-side routes
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
