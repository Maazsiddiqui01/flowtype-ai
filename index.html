    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "Is FlowType free?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — completely. FlowType is free and open source. There's no subscription, no word or minute cap, no account, and no credit card. Optional AI cleanup uses an API key you bring, billed by your provider at their rates — never through us." } },
          { "@type": "Question", "name": "Does my audio leave my computer?", "acceptedAnswer": { "@type": "Answer", "text": "No. FlowType transcribes your voice on-device with Faster-Whisper. Audio is never uploaded for transcription, so there's nothing to leak or log. It works fully offline." } },
          { "@type": "Question", "name": "Is FlowType a good Wispr Flow alternative?", "acceptedAnswer": { "@type": "Answer", "text": "It does the same 'dictate into any app' job as Wispr Flow, but locally, free, open-source, and with no account or word cap. If privacy, cost, and ownership matter more to you than cloud features, FlowType is the stronger fit." } },
          { "@type": "Question", "name": "Does FlowType work offline?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Because transcription runs on your own machine, FlowType works with no internet connection. Optional AI cleanup is the only feature that needs a connection, and only if you enable it." } },
          { "@type": "Question", "name": "Does FlowType work on Windows?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — Windows is the primary, shipped platform. FlowType runs Faster-Whisper locally (CPU int8, with CUDA acceleration when available) and pastes into any app." } },
          { "@type": "Question", "name": "Does FlowType work on Mac?", "acceptedAnswer": { "@type": "Answer", "text": "There's a macOS beta you can download today (default hotkey: Right-Option). It's actively improving — try it and file issues. For production-critical use, know it's still in beta." } },
          { "@type": "Question", "name": "Can I bring my own AI model?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Connect your own OpenRouter, OpenAI, or Anthropic key to clean up transcripts and pick any model — you're never locked to one provider, and you pay only your own usage. You can also skip AI entirely and keep the raw transcript." } },
          { "@type": "Question", "name": "Is it really private if it's open source?", "acceptedAnswer": { "@type": "Answer", "text": "That's why it's private in a way you can trust. Open source means the 'your audio stays local' claim is verifiable — anyone can audit the code. Your API keys are encrypted at rest, and FlowType never proxies your requests." } }
        ]
      }
